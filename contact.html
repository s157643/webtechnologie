<!DOCTYPE html>
<html lang="nl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/fonts.css">


    <title>project</title>
</head>

<body>
    <header>
        <!-- Start navigatiebalk: navbar-expand zorgt dat menu op desktop naast elkaar staat, bg-light geeft een lichte kleur -->
        <nav class="navbar navbar-expand navbar-light bg-light">
            <div class="container">
                <a class="navbar-brand" href="index.html"><img src="asset/images/Logo-free.png" alt="LOGO"></a>
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="portfolio.html">Portfolio</a></li>
                    <li class="nav-item"><a class="nav-link" href="contact.html">Contact</a></li>
                </ul>
            </div>
        </nav>
    </header>


    <main class="container py-5 text-center">
        <h1 class="mb-4">Contactgegevens</h1>
        <p class="lead">Heb je vragen over mijn projecten? Je kunt me bereiken via onderstaande gegevens:</p>

        <div class="mt-5 p-4 bg-light border rounded shadow-sm d-inline-block">
            <p class="mb-2">📧 <strong>E-mail:</strong> abel@student.be</p>
            <p class="mb-0">📍 <strong>Locatie:</strong> Antwerpen, België</p>
        </div>

        <div class="mt-5 text-start mx-auto" style="max-width: 600px;">
            <h3>Stuur mij een bericht</h3>
            <form name="contact" method="POST" data-netlify="true">
                <div class="mb-3">
                    <label for="name" class="form-label">Naam:</label>
                    <input type="text" class="form-control" id="name" name="name" required>
                </div>
                <div class="mb-3">
                    <label for="email" class="form-label">E-mail:</label>
                    <input type="email" class="form-control" id="email" name="email" required>
                </div>
                <div class="mb-3">
                    <label for="message" class="form-label">Bericht:</label>
                    <textarea class="form-control" rows="5" id="message" name="message" required></textarea>
                </div>
                <button type="submit" class="btn btn-primary">Verstuur</button>
            </form>

            <!--  terug-knop eventueel hieronder terugzetten als je dat wilt naar Portfolio altr -->
            <a href="index.html" class="btn btn-outline-secondary mt-4">Terug naar Portfolio</a>
        </div>
    </main>

    <aside>
        <!-- Optioneel: voor extra info of zijbalken op de detailpagina -->
    </aside>


    <!-- Hier komt later je naam of copyright -->

    <footer class="bg-light py-4 text-center border-top mt-5">
        <div class="container">
            <p>&copy; 2026 Abel - Portfolio Project</p>
        </div>
    </footer>


</body>

</html>
